name: release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - package.json

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      should_release: ${{ steps.release.outputs.should_release }}
      create_tag: ${{ steps.release.outputs.create_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: resolve the release tag
        id: release
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          expected_tag="v${version}"

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
              echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
              exit 1
            fi
            echo "tag=$expected_tag" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          subject="$(git log -1 --format=%s)"
          if [[ "$subject" != "$expected_tag" ]]; then
            echo "Ignoring package.json change: commit subject '$subject' is not '$expected_tag'."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "tag=$expected_tag" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "create_tag=true" >> "$GITHUB_OUTPUT"

  test:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: install linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: test the shared core
        run: npm test

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  tag:
    needs: [prepare, test]
    if: needs.prepare.outputs.create_tag == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: create the tested release tag
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "lexis $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

  release:
    needs: [prepare, test, tag]
    if: >-
      always() &&
      needs.prepare.outputs.should_release == 'true' &&
      needs.test.result == 'success' &&
      (needs.tag.result == 'success' || needs.tag.result == 'skipped')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # Serialized: parallel tauri-action jobs race on merging latest.json
      # into the release, which can drop a platform from the updater manifest.
      max-parallel: 1
      matrix:
        include:
          - platform: macos-latest
          - platform: ubuntu-22.04
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install frontend dependencies
        run: npm install

      - name: build and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: 'lexis ${{ needs.prepare.outputs.tag }}'
          releaseBody: |
            Download the bundle for your platform below.

            **CachyOS / Arch Linux (x86_64):** download the `.AppImage`, install `fuse2` with `sudo pacman -S --needed fuse2`, and keep the AppImage in a user-writable location so in-app updates can replace it.
          # Stays a draft until every platform has uploaded, so the
          # releases/latest updater endpoint never serves a partial manifest.
          releaseDraft: true
          prerelease: false

  cachyos:
    name: CachyOS / Arch AppImage smoke test
    needs: [prepare, release]
    if: needs.release.result == 'success'
    runs-on: ubuntu-22.04
    container: archlinux:latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: install CachyOS runtime dependencies
        run: pacman -Syu --noconfirm --needed fontconfig fribidi fuse2 github-cli harfbuzz libglvnd

      - name: download the draft AppImage
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.AppImage' --dir dist

      - name: verify the AppImage on an Arch userspace
        shell: bash
        run: |
          appimage="$(find dist -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          chmod +x "$appimage"
          "$appimage" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          test -x squashfs-root/usr/bin/lexis
          links="$(ldd squashfs-root/usr/bin/lexis)"
          printf '%s\n' "$links"
          if grep -F 'not found' <<< "$links"; then
            exit 1
          fi

  publish:
    needs: [prepare, release, cachyos]
    if: needs.cachyos.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: publish the completed draft release
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --repo ${{ github.repository }} --draft=false
